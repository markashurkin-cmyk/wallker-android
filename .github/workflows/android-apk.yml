name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'Wallker-Android-CI.zip'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Wallker-Android-CI/mobile/android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Extract Android source
        working-directory: .
        run: unzip -q Wallker-Android-CI.zip
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/wallker-android-debug.apk
          cd apk-output
          sha256sum wallker-android-debug.apk > SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: wallker-android-debug
          path: Wallker-Android-CI/mobile/android/apk-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
