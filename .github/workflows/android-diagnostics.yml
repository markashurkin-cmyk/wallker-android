name: Build Android Cloudflare release

on:
  push:
    paths:
      - android-cloudflare.patch
      - .github/workflows/android-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-source/Wallker-Android-CI/mobile/android
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Extract Android source snapshot
        working-directory: .
        run: unzip -q Wallker-Android-CI.zip -d android-source
      - name: Apply Cloudflare server migration
        working-directory: .
        run: git apply --directory=android-source/Wallker-Android-CI android-cloudflare.patch
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build signed APK
        shell: bash
        env:
          WALLKER_KEYSTORE_BASE64: ${{ secrets.WALLKER_KEYSTORE_BASE64 }}
          WALLKER_KEYSTORE_PASSWORD: ${{ secrets.WALLKER_KEYSTORE_PASSWORD }}
          WALLKER_KEY_ALIAS: ${{ secrets.WALLKER_KEY_ALIAS }}
          WALLKER_KEY_PASSWORD: ${{ secrets.WALLKER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in WALLKER_KEYSTORE_BASE64 WALLKER_KEYSTORE_PASSWORD WALLKER_KEY_ALIAS WALLKER_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done
          export WALLKER_KEYSTORE_PATH="$RUNNER_TEMP/wallker-release.jks"
          trap 'rm -f "$WALLKER_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$WALLKER_KEYSTORE_BASE64" | base64 --decode > "$WALLKER_KEYSTORE_PATH"
          gradle --no-daemon --stacktrace :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/wallker-wallet-0.3.2.apk
          cd release-output
          sha256sum wallker-wallet-0.3.2.apk > SHA256SUMS.txt
      - name: Upload signed release
        uses: actions/upload-artifact@v7
        with:
          name: wallker-android-cloudflare
          path: android-source/Wallker-Android-CI/mobile/android/release-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
